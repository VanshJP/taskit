name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: Taskit
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app
        working-directory: .
        run: ./scripts/build-macos-app.sh
